# VPS deployment: Caddy (TLS termination) -> Go API -> Postgres.
# Usage: cp .env.example .env, edit it, then `docker compose up -d`.
# Only Caddy is exposed to the internet; Postgres and the API stay on the internal network.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "12380:80"
      - "12443:443"
      - "12443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build:
      context: ..
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://everyreview:${POSTGRES_PASSWORD}@postgres:5432/everyreview?sslmode=disable
      MEDIA_DIR: /data/media
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: everyreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: everyreview
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Run once, in name order, on first start with an empty data volume (Postgres image
      # convention). Add every new *.up.sql here; existing deployments apply it by hand
      # (see README).
      - ../migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/0001_init.up.sql:ro
      - ../migrations/0002_product_details.up.sql:/docker-entrypoint-initdb.d/0002_product_details.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everyreview -d everyreview"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  media-data:
  caddy-data:
  caddy-config:
