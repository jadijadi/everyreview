openapi: 3.0.3
info:
  title: EveryReview API
  version: "1.0"
  description: >
    Public REST API for the EveryReview mobile clients (Android, iOS).
    Source of truth for the API contract — see ADR-0006 (REST) and
    ADR-0007 (versioning). Both mobile clients generate their network
    layer from this file.
servers:
  - url: https://api.everyreview.app/v1
    description: Production
  - url: https://api.staging.everyreview.app/v1
    description: Staging

tags:
  - name: auth
  - name: products
  - name: reviews

paths:
  /auth/anonymous:
    post:
      tags: [auth]
      summary: Create (or resume) an anonymous account for this device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  description: Client-generated stable device identifier.
              required: [device_id]
      responses:
        "200":
          description: Anonymous session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"

  /auth/email/register:
    post:
      tags: [auth]
      summary: Link an email/password credential to the current account, or create a new account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
              required: [email, password]
      responses:
        "200":
          description: Credential linked, tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "409":
          description: Email already in use.

  /auth/email/login:
    post:
      tags: [auth]
      summary: Log in with email/password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        "200":
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid credentials.

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "200":
          description: New tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"

  /products/{barcode}:
    get:
      tags: [products]
      summary: Look up a product by barcode. Creates a placeholder if unknown.
      parameters:
        - name: barcode
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product found or placeholder created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWithSummary"

  /products/{productId}/details:
    post:
      tags: [products]
      summary: Fill in a placeholder product's details (first writer wins).
      description: >
        Multipart so the optional photo travels with the text fields. Only allowed while
        `is_placeholder` is true; once details exist, corrections go through a separate
        claim flow (not yet specified).
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductDetailsInput"
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWithSummary"
        "400":
          description: Validation failed (missing name, bad price/currency, unsupported image type).
        "404":
          description: Unknown product.
        "409":
          description: Details were already submitted for this product.
        "413":
          description: Image larger than 5 MB.

  /media/{key}:
    get:
      tags: [products]
      summary: Serve an uploaded product photo. `image_url` on a product points here.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, example: products/53ca0602a9c16f8456db2fdec2d5c532.png }
      responses:
        "200":
          description: The image bytes (immutable; cache freely).
          content:
            image/*: {}
        "404":
          description: No such object.

  /products/{productId}/reviews:
    get:
      tags: [reviews]
      summary: List reviews for a product, newest first.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated review list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
    post:
      tags: [reviews]
      summary: Submit a review for a product. Requires authentication (anonymous accounts allowed).
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreate"
      responses:
        "201":
          description: Review created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "429":
          description: Rate limited.

  /reviews/{reviewId}:
    delete:
      tags: [reviews]
      summary: Soft-delete a review (author only).
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted.
        "403":
          description: Not the review's author.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthTokens:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access token TTL in seconds. }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        barcode: { type: string }
        name: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        manufacturer: { type: string, nullable: true }
        description: { type: string, nullable: true }
        price: { type: number, format: double, nullable: true, description: Two decimal places. }
        currency: { type: string, nullable: true, description: ISO 4217 code, e.g. EUR. }
        image_url: { type: string, nullable: true, description: Absolute URL, never a storage key. }
        is_placeholder: { type: boolean }

    ProductDetailsInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        brand: { type: string, maxLength: 120 }
        manufacturer: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        price: { type: string, description: "Decimal, `.` or `,` separator, >= 0.", example: "2,49" }
        currency: { type: string, minLength: 3, maxLength: 3, description: ISO 4217 code (case-insensitive). }
        image:
          type: string
          format: binary
          description: JPEG, PNG or WebP, at most 5 MB. Content type is sniffed server-side.

    RatingSummary:
      type: object
      properties:
        review_count: { type: integer }
        average_rating: { type: number, format: float, nullable: true }

    ProductWithSummary:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            rating_summary:
              $ref: "#/components/schemas/RatingSummary"

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        body: { type: string }
        rating: { type: integer, nullable: true, minimum: 1, maximum: 5 }
        created_at: { type: string, format: date-time }

    ReviewCreate:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        rating: { type: integer, nullable: true, minimum: 1, maximum: 5 }
      required: [body]

    ReviewPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        next_cursor: { type: string, nullable: true }
